# A Tmux configuration consists of setting server options, global options, and
# window options. Server options ("set-option -s" or "set -s") affect the Tmux
# server, not just a session or window. Global sessions ("set-option -g") affect
# all sessions by default, or a specific session when using "-t". Window options
# ("set-window-option -g" or "set-option -w") affect individual windows or all
# windows in a session.

# Show the default session options by starting a new tmux server with no configuration file:
# tmux -Lfoo -f/dev/null start\; show -g

# Show the default window options:
# tmux -Lfoo -f/dev/null start\; show -gw

# We start with plugins, then override customizations, then customize the theme, and then override keybindings.

# TPM Redux is a newer alternative for TPM.
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'azorng/tmux-smooth-scroll'
# Automatically reloads the configuration file on change.
set -g @plugin 'b0o/tmux-autoreload'

# Persist Tmux sessions across restarts. Save session with "<prefix>+Ctrl+s" and
# restore session with "<prefix>+Ctrl+r".
set -g @plugin 'tmux-plugins/tmux-resurrect'
# # Enable saving and restoring tmux pane contents
# set -g @resurrect-capture-pane-contents 'on'

# # List programs to restore. "ssh" matches exact command. Programs with arguments
# # should be double quoted: 'some_program "git log"'. Start with tilde to restore
# # a program whose process contains target name: 'irb pry "~rails server" "~rails
# # console"'.
# set -g @resurrect-processes 'emacs man less more tail top htop btop git lazygit'

# <prefix>+SPACE. Helps learn keybindings.
set -g @plugin 'alexwforsythe/tmux-which-key'

# Now set custom settings without the fear of plugins overriding them.

# Start numbering windows and panes from 1 instead of 0.
set -g base-index 1
setw -g pane-base-index 1
# Automatically renumber windows when a window is closed.
set -g renumber-windows on

# Set terminal window title to session/window name
set -g set-titles on
# Tmux renames windows to reflect the active commands in the current active
# panes. Allow-rename allows applications inside Tmux to rename window titles,
# and is off by default.
setw -g automatic-rename off

# Enable mouse support: clickable windows, panes, and allow resizing panes. 
set -g mouse on
# Enable syncing Tmux clipboard with system clipboard
set -g set-clipboard on
set -g escape-time 1

# If the current session is destroyed, the client by default detaches and
# switches to another active session if available. I do not understand the effectiveness of this setting.
# set -g detach-on-destroy off

# Enable focus events for terminals that support them
set -g focus-events on
# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. 
set -g aggressive-resize on
set -g history-limit 10000
# Do not flash an "Activity in window n" message or when the bell rings
set -g visual-activity off
set -g display-time 2000
# Update the status line every few seconds 
set -g status-interval 5
# Enable 24-bit color (truecolor) for terminals that advertise it
set -g default-terminal tmux-256color
set -as terminal-features 'tmux-256color:RGB,extkeys,clipboard,focus-events,mouse'
# Use Emacs key bindings in tmux command prompt (prefix + :) 
set -g status-keys emacs
set -g extended-keys-format csi-u
# The passthrough mode allows us to work with nested tmux sessions more easily
# without hitting C-b twice every time we want to manipulate the inner tmux
# session. 
set -g allow-passthrough on

# Shell to run commands. The shell decides flags (login or interactive)
set -g default-shell /usr/bin/fish
# # Tmux runs this command explicitly for every new pane/window forcing an interactive shell
# set -g default-command /usr/bin/fish

# The status bar, or status line, serves as a customizable taskbar in the bottom
# of Tmux. It is comprised of 3 sections. The status fields on either side of
# the status line are customizable. The center field is a list of windows.

set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_theme 'dracula'
set -g @powerkit_theme_variant 'dark'
# Auto-detect OS icon 
set -g @powerkit_session_icon 'auto'
set -g @powerkit_transparent 'true'
# Git, hostname, and uptime are other useful plugins, but they can overflow the status bar.
set -g @powerkit_plugins 'ssh'
# Update every 10 minutes (default: 300)
set -g @powerkit_plugin_uptime_cache_ttl 600
# set -g @powerkit_active_window_icon ""
set -g @powerkit_elements_spacing 'windows'
# set -g @powerkit_theme_selector_key 'C-r'

# I want Tmux and Zellij to use the same keybindings.

# Bind is an alias of bind-key. Unbind all default keybindings with "unbind -a".
# But then I will need to rebind everything useful, which is tedious.

# Unbind the default prefix
unbind C-b
# Change prefix keys from "C-b" to "C-]".
set -g prefix C-]
bind C-] send-prefix

# The following are global bindings. "-n" makes the binding global (no prefix is needed).

bind -n Home send Escape "[H"
bind -n End send Escape "[F"

bind -n S-Left previous-window 
bind -n S-Right next-window

bind -n C-q confirm-before -p "Quit tmux session? (y/n)" kill-session

# Use prefix key to hide bindings behind the "locked" mode.

bind '#' list-buffers
bind C-l last-window

# Move current window (tab) left
bind , swap-window -t -1 \; display-message "Moved tab left"
bind C-S-, swap-window -d -t -1 \; display-message "Moved tab left"

# Move current window (tab) right
bind . swap-window -t +1 \; display-message "Moved tab right"
bind C-S-. swap-window -d -t +1 \; display-message "Moved tab right"

# # ALT + LEFT: focus left, or change tab if no pane exists
# bind M-Left if-shell \
#   '[ "$(tmux display-message -p "#{pane_at_left}")" = "1" ]' \
#   'select-pane -L' \
#   'previous-window'

# # ALT + RIGHT: focus right, or change tab if no pane exists
# bind M-Right if-shell \
#   '[ "$(tmux display-message -p "#{pane_at_right}")" = "1" ]' \
#   'select-pane -R' \
#   'next-window'

# Manage panes 
bind M-n split-window -h
bind M-r split-window -h # Split horizontally to the right
bind M-d split-window -v # Split vertically

# Move focus between vertical panes 
bind M-Left select-pane -L \; display-message "Pane: ←"
bind M-Right select-pane -R \; display-message "Pane: →"
bind M-Up select-pane -U \; display-message "Pane: ↑"
bind M-Down select-pane -D \; display-message "Pane: ↓"

bind C-Up resize-pane -U 
bind C-Down resize-pane -D 
bind C-Left resize-pane -L 
bind C-Right resize-pane -R 

# Maximize. Unmaximize with "<prefix>+z".
bind S-Enter resize-pane -Z

# Create a key table named "tabs"
bind t switch-client -T tabs

bind -T tabs n new-window
bind -T tabs 0 select-window -t 0
bind -T tabs 1 select-window -t 1
bind -T tabs 2 select-window -t 2
bind -T tabs 3 select-window -t 3
bind -T tabs 4 select-window -t 4
bind -T tabs 5 select-window -t 5
bind -T tabs 6 select-window -t 6
bind -T tabs 7 select-window -t 7
bind -T tabs 8 select-window -t 8
bind -T tabs 9 select-window -t 9
bind -T tabs x kill-window

# Create a key table named "panes"
bind p switch-client -T panes

bind -T panes Tab select-pane -t :.+
bind -T panes S-Tab select-pane -t :.-
bind -T panes x kill-pane
bind -T panes r command-prompt -I "#(tmux display-message -p '#{pane_title}')" "select-pane -T '%%'"
bind -T panes < resize-pane -L 10
bind -T panes > resize-pane -R 10
bind -T panes - resize-pane -D 10
bind -T panes + resize-pane -U 10

# Move actions
bind h switch-client -T move

bind -T move Tab swap-pane -D
bind -T move S-Tab swap-pane -U
bind -T move Left swap-pane -s:.-
bind -T move Right swap-pane -s:.+
bind -T move Up    swap-pane -U
bind -T move Down  swap-pane -D

# Scroll actions
bind l switch-client -T scroll

# Edit scrollback in $EDITOR 
bind -T scroll e command-prompt -p "Open scrollback in editor?" \
    "capture-pane -S -32768 \; save-buffer /tmp/tmux-buffer \; run-shell '\${EDITOR:-vim} /tmp/tmux-buffer'"
bind -T scroll s copy-mode \; send -X search-backward

# Rename session with "<prefix>+$". Rename window with "<prefix>+w"
bind w command-prompt "rename-window '%%'"

# Navigation
bind PageUp send -X page-up
bind PageDown send -X page-down
bind C-v send -X half-page-down
bind M-v send -X half-page-up

bind Home copy-mode \; send -X start-of-history
bind End copy-mode \; send -X end-of-history

# Session control
bind o switch-client -T session

bind -T session d detach
bind -T session w choose-session

# CSI-u passthrough for terminal Emacs (Alacritty + Ghostty)

# https://github.com/listx/syscfg/tree/master/tmux

# Works with Alacritty and Ghostty
bind -n C-\' send-keys Escape "[39;5u"
bind -n C-, send-keys Escape "[44;5u"
bind -n C-/ send-keys Escape "[47;5u"
bind -n C-= send-keys Escape "[61;5u"
bind -n C-S-BSpace send-keys Escape "[127;6u"

# Does not work with Ghostty
bind -n C-\; send-keys Escape "[59;5u"

# bind e if-shell -F '#{==:#{window_name},emacs}' \
#   'select-window -t emacs' \
#   'new-window -n emacs -c "#{pane_current_path}" "emacsclient -t -a ''|| emacs -nw"'
# Try to select the window named 'emacs'. If fail, create it.
bind e if-shell "tmux select-window -t emacs" "" \
  "new-window -n emacs -c '#{pane_current_path}' 'emacsclient -t -a \"\" || emacs -nw'"

# bind g new-window -n lazygit -c "#{pane_current_path}" 'lazygit'
# bind g if-shell 'tmux list-windows -F "#{window_name}" | grep -q "^lazygit$"' \
#   'select-window -t lazygit' \
#   'new-window -n lazygit lazygit'
bind g if-shell "tmux select-window -t lazygit" "" "new-window -n lazygit -c '#{pane_current_path}' lazygit"
bind C-g display-popup -w 85% -h 85% -d '#{pane_current_path}' -E 'lazygit'

# https://nickgnd.com/pills/2025/12/23/tmux-swap-current-pane-with-hidden-one.html
# Swap active pane with a hidden window for quick context switching. Pressing
# Tab again swaps them back (fully reversible toggle). The -d flag keeps focus
# on the current window, and :_hidden.0 targets the first pane in the _hidden
# window.
bind-key Tab swap-pane -d -s :_hidden.0

# Allows automatic restoring and continuous saving of Tmux environment. The plugin updates the "status-right" variable, so place it last. The plugin will not work if other plugins undo its changes.
set -g @plugin 'tmux-plugins/tmux-continuum'
# Disable automatic restore on a server restart. Restore manually when needed.
# Automatic restore will also not happen if there is a "~/tmux_no_auto_restore"
# file in the directory.
set -g @continuum-restore 'off'
# Minutes. Set this to zero to disable automatic saves.
set -g @continuum-save-interval '20' # minutes

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
